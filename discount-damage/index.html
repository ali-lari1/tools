<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The discount damage meter — a 20% discount is not a 20% cost, by Ali Lari</title>
<meta name="description" content="A discount comes straight off your margin, not your price. See how many more sales you need just to break even after a discount." />
<style>
  :root{
    --navy:#0E1B33; --card:#16273f; --line:#243554;
    --gold:#C7A24C; --gold-soft:#D9BC72; --cream:#F4EFE3; --dim:#9FB0C4;
    --teal:#5DCAA5; --grey:#8894a8; --red:#E5736B;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--navy)}
  body{ color:var(--cream); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap{ min-height:100vh; padding:clamp(28px,5vw,72px) 20px; display:flex; justify-content:center; }
  .col{ width:100%; max-width:580px; }
  .rule{ width:56px; height:5px; background:var(--gold) }
  .eyebrow{ color:var(--gold); font-size:12px; letter-spacing:.16em; text-transform:uppercase; margin-top:16px }
  h1{ font-size:clamp(30px,6vw,46px); line-height:1.05; font-weight:800; letter-spacing:-.02em; margin:10px 0 10px; text-wrap:balance }
  .sub{ color:var(--dim); font-size:16px; line-height:1.55; margin:0; max-width:48ch }
  .byline{ color:var(--dim); font-size:13px; margin-top:10px } .byline b{ color:var(--cream); font-weight:600 }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; margin-top:28px }
  .field{ display:flex; flex-direction:column; gap:7px; margin-bottom:16px } .field:last-child{ margin-bottom:4px }
  label{ font-size:14px; color:var(--dim) } label .hint{ color:var(--grey); font-size:12px }
  .money{ position:relative } .money span{ position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--dim); font-size:16px }
  input[type=number]{ width:100%; background:var(--navy); border:1px solid var(--line); border-radius:10px; color:var(--cream); font-size:17px; font-family:inherit; padding:12px 14px; -moz-appearance:textfield }
  input.money-in{ padding-left:30px }
  input[type=number]:focus{ outline:2px solid var(--gold-soft); outline-offset:1px }
  .slider-row{ display:flex; align-items:center; justify-content:space-between }
  .slider-val{ color:var(--gold); font-weight:700; font-size:17px; font-variant-numeric:tabular-nums }
  input[type=range]{ width:100%; accent-color:var(--gold); margin-top:6px }
  .result{ margin-top:28px }
  .big{ font-size:clamp(32px,7.5vw,52px); font-weight:800; letter-spacing:-.02em; line-height:1.08; text-wrap:balance }
  .big b{ color:var(--red) }
  .bars{ margin-top:22px }
  .bar-row{ margin-bottom:12px }
  .bar-top{ display:flex; justify-content:space-between; font-size:14px; color:var(--dim); margin-bottom:6px } .bar-top b{ color:var(--cream); font-variant-numeric:tabular-nums }
  .track{ height:14px; background:var(--navy); border:1px solid var(--line); border-radius:999px; overflow:hidden }
  .fill{ height:100%; border-radius:999px; transition:width .35s ease }
  .callout{ background:var(--card); border:1px solid var(--line); border-left:3px solid var(--gold); border-radius:0 12px 12px 0; padding:16px 18px; margin-top:22px }
  .callout .lab{ color:var(--gold); font-size:12px; letter-spacing:.12em; text-transform:uppercase } .callout p{ margin:7px 0 0; font-size:16px; line-height:1.5 }
  .invalid{ color:var(--dim); font-size:16px; margin-top:22px }
  .foot{ color:var(--dim); font-size:13px; margin-top:30px; border-top:1px solid var(--line); padding-top:16px; line-height:1.5 }
  @media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="wrap"><div class="col">
  <div class="rule"></div>
  <div class="eyebrow">Before you discount</div>
  <h1>The discount damage meter</h1>
  <p class="sub">A discount does not come off your price. It comes straight off your margin. See how many more sales you need just to stand still.</p>
  <p class="byline">Built by <b>Ali Lari</b></p>

  <div class="card">
    <div class="field">
      <label for="price">Your price <span class="hint">what you charge now</span></label>
      <div class="money"><span>$</span><input id="price" class="money-in" type="number" min="0" step="1" value="100" /></div>
    </div>
    <div class="field">
      <label for="cost">Your cost per sale <span class="hint">what it costs you to deliver one</span></label>
      <div class="money"><span>$</span><input id="cost" class="money-in" type="number" min="0" step="1" value="50" /></div>
    </div>
    <div class="field">
      <label for="disc">The discount</label>
      <div class="slider-row"><span style="color:var(--dim);font-size:13px">how much you knock off</span><span class="slider-val" id="discVal">20%</span></div>
      <input id="disc" type="range" min="1" max="60" step="1" value="20" />
    </div>
  </div>

  <div class="result" id="result"></div>
  <p class="foot">Built by Ali Lari. Send it to anyone about to run a "quick" sale.</p>
</div></div>

<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var out=$('result');
  function n(id){ var v=parseFloat($(id).value); return isNaN(v)?0:v; }

  // COMPUTE-START discount-damage (pure; unit-tested in tests/tools-logic.test.mjs)
  function compute(v){
    var price=v.price, cost=v.cost, disc=v.disc;
    if(!(price>0)) return {kind:"invalid", msg:"Enter your price."};
    var marginNow=price-cost;
    if(marginNow<=0) return {kind:"invalid", msg:"Your cost is at or above your price. There is no margin to discount."};
    if(!(disc>0)) return {kind:"invalid", msg:"Move the slider to set a discount."};
    var newPrice=price*(1-disc/100);
    var newMargin=newPrice-cost;
    var breakEvenDisc=(marginNow/price)*100;
    if(newMargin<=0) return {kind:"loss", newPrice:newPrice, cost:cost, disc:disc, breakEvenDisc:breakEvenDisc};
    var factor=marginNow/newMargin;
    return {kind:"ok", disc:disc, factor:factor, extraPct:(factor-1)*100, marginDrop:(1-newMargin/marginNow)*100};
  }
  // COMPUTE-END

  function pf(x){ return Math.round(x)+'%'; }
  function render(){
    $('discVal').textContent=Math.round(n('disc'))+'%';
    var r=compute({price:n('price'), cost:n('cost'), disc:n('disc')});
    if(r.kind==="invalid"){ out.innerHTML='<p class="invalid">'+r.msg+'</p>'; return; }
    if(r.kind==="loss"){
      out.innerHTML='<div class="big"><b>Stop.</b> At '+pf(r.disc)+' off, your price of $'+Math.round(r.newPrice)+' is at or below your $'+Math.round(r.cost)+' cost. You lose money on every single sale.</div>'+
        '<div class="callout"><div class="lab">What this means</div><p>This is not a discount, it is paying customers to take your product. Your break-even discount is '+pf(r.breakEvenDisc)+', and you are past it.</p></div>';
      return;
    }
    var factor=r.factor, max=Math.max(factor*100,100);
    out.innerHTML=
      '<div class="big">To make the same profit after a '+pf(r.disc)+' discount, you need to sell <b>'+pf(r.extraPct)+' more</b>.</div>'+
      '<div class="bars">'+
        '<div class="bar-row"><div class="bar-top"><span>Sales needed before</span><b>100 units</b></div>'+
          '<div class="track"><div class="fill" style="width:'+(100/max*100).toFixed(1)+'%;background:var(--teal)"></div></div></div>'+
        '<div class="bar-row"><div class="bar-top"><span>Sales needed after the discount</span><b>'+Math.round(factor*100)+' units</b></div>'+
          '<div class="track"><div class="fill" style="width:'+(factor*100/max*100).toFixed(1)+'%;background:var(--red)"></div></div></div>'+
      '</div>'+
      '<div class="callout"><div class="lab">What this means</div><p>A '+pf(r.disc)+' discount cuts your profit per sale by '+pf(r.marginDrop)+', because the whole discount comes out of your margin, not your price. The headline feels small. The damage to your margin is not.</p></div>';
  }
  ['price','cost','disc'].forEach(function(id){ $(id).addEventListener('input', render); });
  render();
})();
</script>
</body>
</html>
